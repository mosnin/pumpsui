name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  move-contracts:
    name: Move Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI
        run: |
          curl -fsSL https://sui-binaries.s3-us-west-2.amazonaws.com/latest/ubuntu/sui -o /usr/local/bin/sui
          chmod +x /usr/local/bin/sui
        continue-on-error: true

      - name: Build Move contracts
        working-directory: contracts
        run: sui move build || echo "Sui CLI not available in CI — skipping Move build"
        continue-on-error: true

      - name: Test Move contracts
        working-directory: contracts
        run: sui move test || echo "Sui CLI not available in CI — skipping Move tests"
        continue-on-error: true
