name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  move-contracts:
    name: Move Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/MystenLabs/homebrew-tap/main/scripts/install.sh | bash || true
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch main sui 2>/dev/null || echo "Using cached Sui CLI"
      - name: Build Move contracts
        run: cd contracts && sui move build
        continue-on-error: true
      - name: Test Move contracts
        run: cd contracts && sui move test
        continue-on-error: true
